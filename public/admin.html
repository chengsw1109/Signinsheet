<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理後台</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="簽到退">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap wide">
  <h1>管理後台</h1>

  <div id="login-card" class="card">
    <h2>管理員登入</h2>
    <label>管理員密碼</label>
    <input id="password" type="password">
    <button id="login-btn">登入</button>
    <div id="login-msg" class="msg err"></div>
  </div>

  <div id="main" class="hidden">
    <div class="card">
      <h2>新增人員</h2>
      <div class="row">
        <div><label>工號 *</label><input id="new-emp"></div>
        <div><label>姓名 *</label><input id="new-name"></div>
        <div><label>部門</label><input id="new-dept"></div>
        <div><button id="add-btn">新增</button></div>
      </div>
      <div id="add-msg" class="msg"></div>
    </div>

    <div class="card">
      <h2>人員清單</h2>
      <div class="table-scroll">
        <table>
          <thead><tr><th>工號</th><th>姓名</th><th>部門</th><th>狀態</th><th>LINE</th><th>操作</th></tr></thead>
          <tbody id="persons-body"></tbody>
        </table>
      </div>
      <div id="person-msg" class="msg"></div>
    </div>

    <div class="card">
      <h2>資料庫備份與還原</h2>
      <div class="row">
        <div><button id="backup-now-btn">立即備份</button></div>
        <div><button id="backup-dl-btn" class="secondary">下載最新備份</button></div>
        <div>
          <label>上傳備份檔還原（選擇之前下載的 .db 檔）</label>
          <input id="backup-file" type="file" accept=".db">
        </div>
        <div><button id="backup-upload-btn" class="secondary">上傳</button></div>
      </div>
      <div id="backup-info" class="muted"></div>
      <div id="backup-msg" class="msg"></div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>備份檔</th><th>大小</th><th>備份時間</th><th>操作</th></tr></thead>
          <tbody id="backup-list"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>出勤統計</h2>
      <div class="row">
        <div><label>姓名／工號（留空＝全部人員）</label><input id="stat-q" placeholder="例：王小明 或 A001"></div>
        <div><label>日統計日期</label><input id="stat-date" type="date"></div>
        <div><button id="stat-daily-btn">查詢日統計</button></div>
        <div><label>月報表月份</label><input id="stat-month" type="month"></div>
        <div><button id="stat-month-btn">查詢月報表</button></div>
        <div><button id="stat-csv-btn" class="secondary">匯出月報 CSV</button></div>
      </div>

      <h2 id="stat-daily-title" class="hidden"></h2>
      <div class="table-scroll">
        <table id="stat-daily-table" class="hidden">
          <thead><tr><th>工號</th><th>姓名</th><th>部門</th><th>簽到</th><th>簽退</th><th>工時</th><th>狀態</th></tr></thead>
          <tbody id="stat-daily-body"></tbody>
        </table>
      </div>

      <h2 id="stat-month-title" class="hidden"></h2>
      <div class="table-scroll">
        <table id="stat-month-table" class="hidden">
          <thead><tr><th>工號</th><th>姓名</th><th>部門</th><th>出勤天數</th><th>遲到次數</th><th>缺勤工作日</th><th>總工時</th></tr></thead>
          <tbody id="stat-month-body"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>簽到退記錄</h2>
      <div class="row">
        <div><label>起始日期</label><input id="from" type="date"></div>
        <div><label>結束日期</label><input id="to" type="date"></div>
        <div><label>姓名／工號</label><input id="q" placeholder="關鍵字"></div>
        <div><button id="query-btn">查詢</button></div>
        <div><button id="csv-btn" class="secondary">匯出 CSV</button></div>
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>時間</th><th>工號</th><th>姓名</th><th>部門</th><th>動作</th><th>站點</th><th>位置</th></tr></thead>
          <tbody id="records-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <p class="center"><a href="/">回首頁</a></p>
</div>

<script>
const $ = (id) => document.getElementById(id);
let session = sessionStorage.getItem('admin_session');

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      ...(session ? { Authorization: 'Bearer ' + session } : {}),
    },
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) {
    sessionStorage.removeItem('admin_session');
    session = null;
    $('main').classList.add('hidden');
    $('login-card').classList.remove('hidden');
    throw new Error(data.error || '請重新登入');
  }
  if (!res.ok) throw new Error(data.error || '發生錯誤');
  return data;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

$('login-btn').onclick = async () => {
  $('login-msg').textContent = '';
  try {
    const data = await api('/api/admin/login', {
      method: 'POST',
      body: JSON.stringify({ password: $('password').value }),
    });
    session = data.session;
    sessionStorage.setItem('admin_session', session);
    showMain();
  } catch (e) {
    $('login-msg').textContent = e.message;
  }
};
$('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('login-btn').click(); });

function showMain() {
  $('login-card').classList.add('hidden');
  $('main').classList.remove('hidden');
  const now = new Date();
  $('stat-date').value = now.toLocaleDateString('sv-SE');
  $('stat-month').value = now.toLocaleDateString('sv-SE').slice(0, 7);
  loadPersons();
  loadRecords();
  loadDailyStats();
  loadBackupStatus();
}

async function loadBackupStatus() {
  try {
    const s = await api('/api/admin/backups');
    const latest = s.latest
      ? `最新備份：${s.latest.file}（${(s.latest.size / 1024).toFixed(0)} KB，${new Date(s.latest.at).toLocaleString('zh-TW')}）`
      : '尚無備份';
    $('backup-info').textContent =
      `${latest}｜每日 ${s.schedule_time} 自動備份，保留 ${s.keep_days} 天`;
    const { backups } = await api('/api/admin/backup/list');
    $('backup-list').innerHTML = backups.map(b => `
      <tr>
        <td>${escapeHtml(b.file)}</td>
        <td>${(b.size / 1024).toFixed(0)} KB</td>
        <td>${new Date(b.mtime).toLocaleString('zh-TW')}</td>
        <td>
          <button class="small danger" onclick="restoreBackup('${escapeHtml(b.file)}')">還原</button>
          <button class="small" onclick="downloadBackup('${escapeHtml(b.file)}')">下載</button>
          <button class="small secondary" onclick="deleteBackup('${escapeHtml(b.file)}')">刪除</button>
        </td>
      </tr>`).join('') || '<tr><td colspan="4" class="muted">尚無備份檔</td></tr>';
  } catch {}
}

function backupMsg(ok, text) {
  const el = $('backup-msg');
  el.className = 'msg ' + (ok ? 'ok' : 'err');
  el.textContent = text;
}

window.restoreBackup = async (file) => {
  if (!confirm(`確定要用「${file}」還原資料？\n\n目前的人員與簽到記錄將被備份內容「完全取代」。\n（系統會先自動備份現況，萬一按錯可再還原回來）`)) return;
  if (!confirm('最後確認：真的要執行還原嗎？')) return;
  backupMsg(true, '還原中，請稍候…');
  try {
    const r = await api('/api/admin/backup/restore', { method: 'POST', body: JSON.stringify({ file }) });
    backupMsg(true, `✅ 還原完成：人員 ${r.persons} 筆、記錄 ${r.records} 筆（還原前現況已存為 ${r.safety}）`);
    loadPersons(); loadRecords(); loadDailyStats(); loadBackupStatus();
  } catch (e) {
    backupMsg(false, e.message);
  }
};

window.downloadBackup = (file) => {
  location.href = `/api/admin/backup/download?file=${encodeURIComponent(file)}&session=${encodeURIComponent(session)}`;
};

window.deleteBackup = async (file) => {
  if (!confirm(`確定要刪除備份「${file}」？`)) return;
  try {
    await api('/api/admin/backup/delete', { method: 'POST', body: JSON.stringify({ file }) });
    loadBackupStatus();
  } catch (e) {
    backupMsg(false, e.message);
  }
};

$('backup-upload-btn').onclick = async () => {
  const f = $('backup-file').files[0];
  if (!f) return backupMsg(false, '請先選擇備份檔（.db）');
  backupMsg(true, '上傳並驗證中…');
  try {
    const res = await fetch('/api/admin/backup/upload', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + session, 'Content-Type': 'application/octet-stream' },
      body: f,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || '上傳失敗');
    backupMsg(true, `✅ 上傳成功：${data.file}（含人員 ${data.persons} 筆、記錄 ${data.records} 筆），可在下方清單按「還原」`);
    $('backup-file').value = '';
    loadBackupStatus();
  } catch (e) {
    backupMsg(false, e.message);
  }
};

$('backup-now-btn').onclick = async () => {
  backupMsg(true, '備份中…');
  try {
    const r = await api('/api/admin/backup', { method: 'POST' });
    backupMsg(true, `✅ 備份完成：${r.file}`);
    loadBackupStatus();
  } catch (e) {
    backupMsg(false, e.message);
  }
};

$('backup-dl-btn').onclick = () => {
  location.href = '/api/admin/backup/download?session=' + encodeURIComponent(session);
};

const fmtHM = (min) => min == null ? '-' : `${Math.floor(min / 60)} 時 ${min % 60} 分`;
const fmtClock = (iso) => iso ? new Date(iso).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false }) : '-';
const STATUS_BADGE = {
  done: '<span class="badge in">完成</span>',
  no_out: '<span class="badge out">未簽退</span>',
  absent: '<span class="badge off">未簽到</span>',
};

const statQuery = (extra) => new URLSearchParams({ ...extra, q: $('stat-q').value.trim() });

async function loadDailyStats() {
  const { date, rows } = await api('/api/admin/stats/daily?' + statQuery({ date: $('stat-date').value || '' }));
  $('stat-daily-title').textContent = `日統計 ${date}` + ($('stat-q').value.trim() ? `（篩選：${$('stat-q').value.trim()}）` : '');
  $('stat-daily-title').classList.remove('hidden');
  $('stat-daily-table').classList.remove('hidden');
  $('stat-daily-body').innerHTML = rows.map(r => `
    <tr>
      <td>${escapeHtml(r.emp_no)}</td>
      <td>${escapeHtml(r.name)}</td>
      <td>${escapeHtml(r.dept || '-')}</td>
      <td>${fmtClock(r.first_in)}${r.late ? ' <span class="badge out">遲到</span>' : ''}</td>
      <td>${fmtClock(r.last_out)}</td>
      <td>${fmtHM(r.work_minutes)}</td>
      <td>${STATUS_BADGE[r.status] || '-'}</td>
    </tr>`).join('') || '<tr><td colspan="7" class="muted">尚無人員</td></tr>';
}

async function loadMonthlyStats() {
  const data = await api('/api/admin/stats/monthly?' + statQuery({ month: $('stat-month').value || '' }));
  $('stat-month-title').textContent = `月報表 ${data.month}（已過工作日 ${data.workdays_elapsed} 天）` + ($('stat-q').value.trim() ? `（篩選：${$('stat-q').value.trim()}）` : '');
  $('stat-month-title').classList.remove('hidden');
  $('stat-month-table').classList.remove('hidden');
  $('stat-month-body').innerHTML = data.rows.map(r => `
    <tr>
      <td>${escapeHtml(r.emp_no)}</td>
      <td>${escapeHtml(r.name)}</td>
      <td>${escapeHtml(r.dept || '-')}</td>
      <td>${r.attend_days}</td>
      <td>${r.late_count}</td>
      <td>${r.absent_workdays}</td>
      <td>${fmtHM(r.total_minutes)}</td>
    </tr>`).join('') || '<tr><td colspan="7" class="muted">尚無人員</td></tr>';
}

$('stat-daily-btn').onclick = loadDailyStats;
$('stat-month-btn').onclick = loadMonthlyStats;
$('stat-csv-btn').onclick = () => {
  const p = statQuery({ month: $('stat-month').value || '', session });
  location.href = '/api/admin/stats/monthly.csv?' + p;
};
$('stat-q').addEventListener('keydown', (e) => { if (e.key === 'Enter') loadDailyStats(); });

async function loadPersons() {
  const { persons } = await api('/api/admin/persons');
  $('persons-body').innerHTML = persons.map(p => `
    <tr>
      <td>${escapeHtml(p.emp_no)}</td>
      <td>${escapeHtml(p.name)}</td>
      <td>${escapeHtml(p.dept || '-')}</td>
      <td><span class="badge ${p.active ? 'in' : 'off'}">${p.active ? '啟用' : '停用'}</span></td>
      <td><span class="badge ${p.line_bound ? 'in' : 'off'}">${p.line_bound ? '已綁定' : '未綁定'}</span></td>
      <td>
        <button class="small" onclick="resetPin(${p.id}, '${escapeHtml(p.name)}')">重設 PIN</button>
        <button class="small ${p.active ? 'danger' : ''}" onclick="toggleActive(${p.id}, ${p.active ? 0 : 1})">
          ${p.active ? '停用' : '啟用'}
        </button>
        ${p.line_bound ? `<button class="small secondary" onclick="unbindLine(${p.id}, '${escapeHtml(p.name)}')">解綁 LINE</button>` : ''}
      </td>
    </tr>`).join('') || '<tr><td colspan="6" class="muted">尚無人員，請先新增</td></tr>';
}

$('add-btn').onclick = async () => {
  const el = $('add-msg');
  el.className = 'msg';
  el.textContent = '';
  try {
    const data = await api('/api/admin/persons', {
      method: 'POST',
      body: JSON.stringify({ emp_no: $('new-emp').value, name: $('new-name').value, dept: $('new-dept').value }),
    });
    el.className = 'msg ok';
    el.textContent = `新增成功！初始 PIN 碼：${data.pin}（僅顯示這一次，請轉交給本人）`;
    $('new-emp').value = $('new-name').value = $('new-dept').value = '';
    loadPersons();
  } catch (e) {
    el.className = 'msg err';
    el.textContent = e.message;
  }
};

window.resetPin = async (id, name) => {
  if (!confirm(`確定要重設「${name}」的 PIN 碼？`)) return;
  const el = $('person-msg');
  try {
    const data = await api(`/api/admin/persons/${id}/reset-pin`, { method: 'POST' });
    el.className = 'msg ok';
    el.textContent = `「${name}」的新 PIN 碼：${data.pin}（僅顯示這一次）`;
  } catch (e) {
    el.className = 'msg err';
    el.textContent = e.message;
  }
};

window.unbindLine = async (id, name) => {
  if (!confirm(`確定要解除「${name}」的 LINE 綁定？`)) return;
  try {
    await api(`/api/admin/persons/${id}/unbind-line`, { method: 'POST' });
    loadPersons();
  } catch (e) {
    $('person-msg').className = 'msg err';
    $('person-msg').textContent = e.message;
  }
};

window.toggleActive = async (id, active) => {
  try {
    await api(`/api/admin/persons/${id}/active`, { method: 'POST', body: JSON.stringify({ active }) });
    loadPersons();
  } catch (e) {
    $('person-msg').className = 'msg err';
    $('person-msg').textContent = e.message;
  }
};

function recordQuery() {
  const p = new URLSearchParams();
  if ($('from').value) p.set('from', $('from').value);
  if ($('to').value) p.set('to', $('to').value);
  if ($('q').value.trim()) p.set('q', $('q').value.trim());
  return p;
}

async function loadRecords() {
  const { records } = await api('/api/admin/records?' + recordQuery());
  $('records-body').innerHTML = records.map(r => `
    <tr>
      <td>${new Date(r.scanned_at).toLocaleString('zh-TW')}</td>
      <td>${escapeHtml(r.emp_no)}</td>
      <td>${escapeHtml(r.name)}</td>
      <td>${escapeHtml(r.dept || '-')}</td>
      <td><span class="badge ${r.action}">${r.action === 'in' ? '簽到' : '簽退'}</span></td>
      <td>${escapeHtml(r.station || '-')}</td>
      <td>${r.lat != null ? `<a href="https://maps.google.com/?q=${r.lat},${r.lng}" target="_blank">${r.lat.toFixed(5)}, ${r.lng.toFixed(5)}</a>` : '-'}</td>
    </tr>`).join('') || '<tr><td colspan="7" class="muted">查無記錄</td></tr>';
}

$('query-btn').onclick = loadRecords;
$('csv-btn').onclick = () => {
  const p = recordQuery();
  p.set('session', session);
  location.href = '/api/admin/records.csv?' + p;
};

if (session) showMain();
</script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
</script>
</body>
</html>
